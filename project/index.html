<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle</title>
    <link rel="stylesheet" href="index.css"><!-- 引入同目录下的 index.css 文件来实现样式 -->
</head>

<body>
    <!-- 请在此文件中给出你的 html 代码并引入同目录下的 css 和 js 文件来实现样式和逻辑功能 -->
    <div id="game-container">
        <!-- all things that will be contain in this -->

        <header>
            <h1>WORDLE GAME</h1>
            <div class="controls">
                <button id="restart-btn" class="control-btn">再来一局</button>
                <button id="show-answer-btn" class="control-btn">显示答案</button>
            </div>
        </header>

        <div id="board-container">
            <div id="board">

                <div class="row">
                    <div class="tile">1A</div>
                    <div class="tile">1B</div>
                    <div class="tile">1C</div>
                    <div class="tile">1D</div>
                    <div class="tile">1E</div>
                </div>
                <div class="row">
                    <div class="tile">2A</div>
                    <div class="tile">2B</div>
                    <div class="tile">2C</div>
                    <div class="tile">2D</div>
                    <div class="tile">2E</div>
                </div>
                <div class="row">
                    <div class="tile">3A</div>
                    <div class="tile">3B</div>
                    <div class="tile">3C</div>
                    <div class="tile">3D</div>
                    <div class="tile">3E</div>
                </div>
                <div class="row">
                    <div class="tile">4A</div>
                    <div class="tile">4B</div>
                    <div class="tile">4C</div>
                    <div class="tile">4D</div>
                    <div class="tile">4E</div>
                </div>
                <div class="row">
                    <div class="tile">5A</div>
                    <div class="tile">5B</div>
                    <div class="tile">5C</div>
                    <div class="tile">5D</div>
                    <div class="tile">5E</div>
                </div>
                <div class="row">
                    <div class="tile">6A</div>
                    <div class="tile">6B</div>
                    <div class="tile">6C</div>
                    <div class="tile">6D</div>
                    <div class="tile">6E</div>
                </div>
            </div>
        </div>
        <div id="keyboard-container"></div>
    </div>

    <script src="index.js"></script><!-- 引入同目录下的 index.js 文件来实现游戏的逻辑功能 -->
</body>

</html>
