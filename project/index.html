<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Wordle</h1>
        </header>
        
        <div id="message-container"></div>
        
        <div id="board-container">
            <!-- Grid will be generated by JS, or we can hardcode it here. 
                 Given the requirement for modularity, let's generate it or hardcode it clearly.
                 Hardcoding is easier for beginners to see the structure. -->
            <div id="board"></div>
        </div>

        <div id="keyboard-container">
            <!-- Keyboard will be generated by JS -->
        </div>

        <button id="restart-btn" style="display: none;">Play Again</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
